# macOS app (Eaon Desktop) — build + release pipeline for v1.5.
#
# Jobs
#   1. agent-tests   — core agent: compile + full suite (Linux, cheap)
#   2. macapp-build  — matrix of native macOS runners (arm64 + x64); each
#                      compiles node-pty for its own arch, runs the headless
#                      pty E2E, and packages an unsigned DMG.
#   3. release       — tag-only ('v*'): uploads both DMGs to a GitHub release.
#
# No Apple identity: CSC_IDENTITY_AUTO_DISCOVERY is disabled and notarization
# is intentionally skipped — the installed app needs a first-launch right-click
# -> Open (see README "macOS app (Eaon Desktop)").
name: macOS App Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Core agent — compile & test on Linux (runs on PRs too).
  # ---------------------------------------------------------------------------
  agent-tests:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install agent deps
        run: npm ci

      - name: Build agent
        run: npm run build

      - name: Agent test suite
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. macOS desktop app — compile the engine, bundle + test + package DMG.
  #    Each matrix entry builds natively for its own arch (no cross-compile):
  #      macos-14 (arm64) and macos-13 (x64) on GitHub-hosted macOS runners.
  # ---------------------------------------------------------------------------
  macapp-build:
    name: Eaon Desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build
      ELECTRON_BUILDER_CACHE: /tmp/electron-builder-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Two lockfiles: agent (root) + mac app (macapp/).
          cache-dependency-path: |
            package-lock.json
            macapp/package-lock.json

      # Agent must be built first — package-engine bundles dist/ into the app.
      - name: Install agent deps (root)
        run: npm ci

      - name: Build agent (dist/)
        run: npm run build

      # electron-builder downloads Electron (~100 MB) + helper binaries once.
      # ELECTRON_BUILDER_CACHE points at this cache mount.
      - name: Restore electron-builder cache
        uses: actions/cache@v4
        with:
          path: /tmp/electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macapp/package.json', 'macapp/package-lock.json') }}

      # App deps: electron, electron-builder, xterm, node-pty (compiles here).
      - name: Install app deps (macapp)
        working-directory: macapp
        run: npm ci

      # Package the engine: repo root is passed explicitly (argv[2] contract),
      # so this is correct regardless of the script's default resolution.
      # Downloads the Node runtime tarball for the runner's own arch.
      - name: Package engine
        run: node macapp/scripts/package-engine.mjs "$GITHUB_WORKSPACE"

      - name: Smoke test (headless pty E2E)
        working-directory: macapp
        run: npm run smoke

      - name: Build DMG
        working-directory: macapp
        run: |
          mkdir -p "$ELECTRON_BUILDER_CACHE"
          # --publish never: electron-builder's default mode is onTagOrDraft, so on a
          # v* tag push each matrix job would otherwise auto-create a partial GitHub
          # release (GITHUB_TOKEN is writable here and collides with the `release` job,
          # which owns publishing). Packaging here, publishing there.
          npm run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Eaon-Desktop-${{ matrix.arch }}-dmg
          path: macapp/release/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Release — tag-only; attach arm64 + x64 DMGs and generate notes.
  # ---------------------------------------------------------------------------
  release:
    name: Release DMGs
    runs-on: ubuntu-latest
    needs: [agent-tests, macapp-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: Eaon-Desktop-arm64-dmg
          path: ./dmg-arm64

      - name: Download x64 DMG
        uses: actions/download-artifact@v4
        with:
          name: Eaon-Desktop-x64-dmg
          path: ./dmg-x64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dmg-arm64/*.dmg
            dmg-x64/*.dmg