name: macOS app

# Builds the Eaon Agent desktop app and attaches the DMGs to a release.
#
#   push a tag  v*  -> builds both architectures and publishes the release
#   manual run      -> builds and keeps the DMGs as workflow artifacts
#
# There are no native modules anywhere in the app, so one arm64 runner can
# package both slices.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the agent
        run: npm ci

      - name: Test the agent
        run: npm test

      - name: Install the app toolchain
        working-directory: macapp
        run: npm ci

      - name: Test the app engine and renderer
        working-directory: macapp
        run: npm run smoke

      - name: Build the app icon
        working-directory: macapp
        run: npm run icon

      - name: Package the DMGs
        working-directory: macapp
        # Unsigned build: no Developer ID certificate in CI, so tell
        # electron-builder not to go looking for one.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Show what was built
        working-directory: macapp
        run: ls -la release/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: eaon-agent-dmg
          path: macapp/release/*.dmg
          if-no-files-found: error

      - name: Attach the DMGs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macapp/release/*.dmg
          generate_release_notes: true
